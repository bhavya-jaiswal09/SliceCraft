version: "3"

services:
  node:
    image: node:16.14
    container_name: slicecraft_backend
    build: ./
    tty: true
    stdin_open: true
    command: bash
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - postgresdb
    ports:
      - 3001:3001
    environment:
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=slicecraftpassword
      - DB_NAME=slicecraft
      - PORT=3001
      - TYPEORM_MIGRATIONS=src/Database/Migrations/*ts
      - TYPEORM_MIGRATIONS_DIR=src/Database/Migrations

  postgresdb:
    image: postgres:latest
    container_name: slicecraft_db
    volumes:
      - ./:/app
    restart: always
    environment:
      POSTGRES_PASSWORD: slicecraftpassword
      POSTGRES_USER: admin
      POSTGRES_DB: slicecraft

    ports:
      - 5432:5432

networks:
  default:
    name: slicecraft_net
