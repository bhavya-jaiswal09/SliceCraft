version: "3"

services:
  node:
    image: node:16.14
    # Nome do container para facilitar execução
    container_name: slicecraft_backend
    # Caminho da Dockerfile
    build: ./
    # Mesmo que `docker run -t`
    tty: true
    # Mesmo que `docker run -i`
    stdin_open: true
    # Substitui o comando padrão da imagem do node
    command: bash
    # Restarta a imagem caso algo a faça parar
    restart: always
    # Diretório padrão de execução
    working_dir: /app
    # Lista de volumes (diretórios) mapeados de fora para dentro do container
    volumes:
      # Monta o diretório atual, com todos os dados do projeto,
      # working directory /app
      - ./:/app
    # Dependent services list

    depends_on:
      # Wait for postgres before starting node app
      - postgresdb
    # Lista de portas mapeadas de dentro para fora do container
    # na notação porta_de_fora:porta_de_dentro
    ports:
      # Expose database port
      - 3001:3001
    environment:
      # - MONGO_URI=mongodb://mongodb:27017/pizzeria
      # env_file:
      # - .env
    

      - DB_HOST=postgresdb

      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASS=slicecraftpassword
      - DB_NAME=slicecraft
      - PORT=3001
      - TYPEORM_MIGRATIONS=src/Database/Migrations/*ts
      - TYPEORM_MIGRATIONS_DIR=src/Database/Migrations

     

  # PostgreSQL database service
  postgresdb:
    image: postgres:latest
    container_name: slicecraft_db
    volumes:
      - ./:/app
    restart: always
    environment:
        POSTGRES_PASSWORD: slicecraftpassword
        POSTGRES_USER: admin
        POSTGRES_DB: slicecraft

    ports:
      # Expose database port
      - 5432:5432

        
# Networks configuration for services
networks:
  # Rede padrão, criada automaticamente
  default:
    # Dá um nome específico à rede padrão
    name: slicecraft_net
# As chaves `tty`, `stdin_open` e `command` fazem com que o container fique
# rodando em segundo plano, bem como tornam possível o uso do comando
# `docker attach`, já deixando o terminal atual acoplado ao container, direto
# no bash. Apesar disso, utilizar o attach mais de uma vez irá replicar o
# terminal, portanto é melhor utilizar o comando `docker exec`.

# Custom default network name
# to prevent container conflicts
# across projects
  